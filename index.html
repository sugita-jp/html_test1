<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>散歩日和</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      color: #4a443d;
      background-color: #f5f0e8;
      padding-bottom: 110px;
      animation: fadeIn 1s ease-in;
    }

/* ヘッダー */
header {
  position: relative;
  height: 280px;
  overflow: hidden;

  background: linear-gradient(
    to bottom,
    #72b9df 0%,
    #b9dceb 55%,
    #e9dfc8 100%
  );

  color: white;
  display: flex;
  align-items: center;
  justify-content: center;

  animation: skyChange 60s linear infinite;
}

@keyframes skyChange {

  /* 朝・昼 */
  0% {
    background: linear-gradient(
      to bottom,
      #72b9df,
      #b9dceb,
      #e9dfc8
    );
  }

  /* 青空 */
  35% {
    background: linear-gradient(
      to bottom,
      #55a9d6,
      #a9d7e8,
      #e8dfc8
    );
  }

  /* 夕焼け開始 */
  65% {
    background: linear-gradient(
      to bottom,
      #df806f,
      #f2ad7e,
      #f4d19b
    );
  }

  /* 夕焼け */
  80% {
    background: linear-gradient(
      to bottom,
      #d9655f,
      #ee9271,
      #f5c58c
    );
  }

  /* 夜に戻る */
  100% {
    background: linear-gradient(
      to bottom,
      #72b9df,
      #b9dceb,
      #e9dfc8
    );
  }
}

/* 木々 */
header::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;

  width: 200%;
  height: 90px;

  background:
    radial-gradient(
      circle at 5% 100%,
      #536b4b 0 45px,
      transparent 46px
    ),
    radial-gradient(
      circle at 12% 100%,
      #617957 0 55px,
      transparent 56px
    ),
    radial-gradient(
      circle at 20% 100%,
      #4d6546 0 50px,
      transparent 51px
    ),
    radial-gradient(
      circle at 30% 100%,
      #617957 0 65px,
      transparent 66px
    ),
    radial-gradient(
      circle at 42% 100%,
      #536b4b 0 50px,
      transparent 51px
    ),
    radial-gradient(
      circle at 55% 100%,
      #617957 0 60px,
      transparent 61px
    ),
    radial-gradient(
      circle at 68% 100%,
      #4d6546 0 55px,
      transparent 56px
    ),
    radial-gradient(
      circle at 80% 100%,
      #617957 0 65px,
      transparent 66px
    ),
    radial-gradient(
      circle at 93% 100%,
      #536b4b 0 50px,
      transparent 51px
    );

  animation: treesMove 40s linear infinite;
}

/* タイトルを木々より前に表示 */
header h1 {
  position: relative;
  z-index: 2;

  margin: 0;
  font-size: 36px;
  letter-spacing: 6px;

  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);

  animation: titleFade 1.2s ease-out;
}

/* 木々をゆっくり動かす */
@keyframes treesMove {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}

header::after {
  content: "";
  position: absolute;
  top: 40px;
  left: 15%;

  width: 180px;
  height: 50px;

  background: rgba(255, 255, 255, 0.75);
  border-radius: 50px;

  box-shadow:
    60px -20px 0 10px rgba(255, 255, 255, 0.75),
    110px 5px 0 5px rgba(255, 255, 255, 0.75);

  animation: cloudMove 60s linear infinite;
}

@keyframes cloudMove {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(130vw);
  }
}

.clouds {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 150px;

  overflow: hidden;
}

.cloud {
  position: absolute;

  width: 150px;
  height: 40px;

  background: rgba(255, 255, 255, 0.75);
  border-radius: 50px;

  z-index: 2;
}

/* 雲の形 */
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;

  background: rgba(255, 255, 255, 0.75);
  border-radius: 50%;
}

.cloud::before {
  width: 60px;
  height: 60px;

  left: 25px;
  bottom: 10px;
}

.cloud::after {
  width: 75px;
  height: 75px;

  right: 25px;
  bottom: 5px;
}

/* 雲1 */
.cloud1 {
  top: 30px;
  left: -180px;

  animation: cloudMove 50s linear infinite;
}

/* 雲2 */
.cloud2 {
  top: 80px;
  left: -400px;

  transform: scale(0.7);

  animation: cloudMove 50s linear infinite;
  animation-delay: 12s;
}

/* 雲3 */
.cloud3 {
  top: 45px;
  left: -600px;

  transform: scale(1.2);

  animation: cloudMove 50s linear infinite;
  animation-delay: 25s;
}

/* 雲4 */
.cloud4 {
  top: 100px;
  left: -800px;

  transform: scale(0.6);

  animation: cloudMove 50s linear infinite;
  animation-delay: 38s;
}

@keyframes cloudMove {

  from {
    left: -200px;
  }

  to {
    left: 110%;
  }

}


    /* メイン */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* 日記 */
    section {
      background-color: #fffdf8;
      margin-bottom: 24px;
      padding: 30px;
      border-radius: 6px;
      border: 1px solid #e5ddd0;
      box-shadow: 0 2px 8px rgba(80, 65, 45, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    section:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(80, 65, 45, 0.15);
    }

    /* 日付・天気 */
    .info {
      display: flex;
      gap: 40px;
      border-bottom: 1px solid #ddd3c4;
      margin-bottom: 20px;
    }

    h2 {
      color: #66594c;
      font-size: 22px;
    }

    p {
      line-height: 1.9;
      font-size: 16px;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #5d6653;
      color: #f8f4ec;
      padding: 16px;
      text-align: center;
    }

    footer p {
      margin: 4px 0;
    }

    footer a {
      color: #e8d8b8;
      margin: 0 8px;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>

<body>

<header>
  <div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
  </div>

  <div class="forest"></div>

  <h1>散歩日和</h1>
</header>

  <main>

    <!-- 日記 -->
    <section>

      <div class="info">
        <h2>日付：8月16日</h2>
        <h2>天気：晴れ</h2>
      </div>

      <p>
        今日は天気がよかったので、近所をゆっくり散歩しました。
        暑い日でしたが、木陰に入ると風が涼しくて気持ちよかったです。
      </p>

      <p>
        道端に小さな花が咲いているのを見つけました。
        普段は気づかないような景色も、ゆっくり歩いてみると
        意外とたくさん見つかるものだなと思いました。
      </p>

      <img src="cupcake.jpg" alt="カップケーキ">
    </section>

    <!-- お問い合わせ -->
    <section>
      <h2>お問い合わせ</h2>
      <p>
        ご質問やご感想がございましたら、お気軽にお問い合わせください。
      </p>
    </section>

  </main>

  <footer>
    <p>お問い合わせ：example@example.com</p>
    <p>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </p>
  </footer>

</body>
</html>
